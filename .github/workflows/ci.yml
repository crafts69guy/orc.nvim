name: Lua checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        neovim: [v0.11.0, stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          version: ${{ matrix.neovim }}
          neovim: true
      - name: Install formatter
        run: cargo install stylua --locked --version 2.6.0
      - name: Lua format
        run: stylua --check lua test scripts bin/orc plugin evals
      - name: Generated agents
        run: nvim --clean -l scripts/gen-agents.lua --check
      - name: Tests and three coverage gates
        run: nvim --clean -l test/run.lua --coverage

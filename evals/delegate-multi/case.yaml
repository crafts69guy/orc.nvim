schema_version: "1.1"
name: delegate-multi
description: "Fresh Lua behavior case: delegate-multi"
tags: [orc]
plugins: ["../.."]
runs: 2
context:
  scaffold_script: fixture.lua
execution:
  model: opus
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Bash, Edit, Write, Agent, Skill]
  prompt: "Add currency support across src/currency.lua and src/format.lua. Return module tables. currency.symbolFor(code) returns $ for USD, € for EUR, £ for GBP and raises {kind='RangeError',message=...} otherwise. format.formatPrice(cents,currency) defaults currency to USD and uses symbolFor. Add currency tests and EUR/GBP price tests. Existing tests must pass. Do not commit. Run nvim --clean -l check.lua last."
graders:
  - {"name":"implementer-spawned","type":"tool_used","tool":"Agent","input_match":"\"subagent_type\"\\s*:\\s*\"orc:implementer\""}
  - {"name":"no-dispatch","type":"tool_used","tool":"Skill","input_match":"\"skill\"\\s*:\\s*\"(?:orc:)?dispatch\"","min":0,"max":0,"arm":"both"}
  - {"name":"symbol-for","type":"regex","target":{"source":"file","path":"src/currency.lua"},"pattern":"symbolFor"}
  - {"name":"uses-symbol-for","type":"regex","target":{"source":"file","path":"src/format.lua"},"pattern":"symbolFor"}
  - {"name":"tests-pass","type":"regex","target":{"source":"file","path":"check.out"},"flags":"m","pattern":"^# pass ([3-9]|\\d{2,})\\n# fail 0$"}
  - {"name":"no-commit","type":"regex","target":{"source":"file","path":"check.out"},"flags":"m","pattern":"^commit: ","match":"not_contains"}
